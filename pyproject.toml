[project]
name = "mlops-churn"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Gos Shafadonia", email = "g.shafadonia@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gradio==6.0.1",
    "matplotlib>=3.10.9",
    "mlflow==3.1.4",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scikit-learn==1.7.1",
    "scipy>=1.17.1",
    "xgboost>=3.2.0",
]

[project.scripts]
mlops-churn = "mlops_churn:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
